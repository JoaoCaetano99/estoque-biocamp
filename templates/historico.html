<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Histórico – Estoque Biocamp</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="{{ url_for('static', filename='favicon.png') }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-4">
    <h2 class="mb-3">Histórico de Movimentações</h2>
    <table class="table table-bordered table-hover">
      <thead class="table-light">
        <tr>
          <th>Data/Hora</th>
          <th>Usuário</th>
          <th>Produto</th>
          <th>Tipo</th>
          <th>Qtd.</th>
          <th>Saldo Após</th>
        </tr>
      </thead>
      <tbody>
        {% for m in movs %}
        <tr>
          <td>{{ m.datahora.strftime("%Y-%m-%d %H:%M") }}</td>
          <td>{{ m.usuario.nome }}</td>
          <td>{{ m.produto.nome }}</td>
          <td>{{ m.tipo }}</td>
          <td>{{ m.quantidade }}</td>
          <td>{{ m.saldo_apos }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
    <a href="{{ url_for('estoque') }}" class="btn btn-link">Voltar</a>
  </div>
</body>
</html>
