<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Login – Estoque Biocamp</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="{{ url_for('static', filename='favicon.png') }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container d-flex vh-100">
    <div class="row justify-content-center align-self-center w-100">
      <div class="col-md-5 col-lg-4 mx-auto">
        <div class="card shadow p-4 position-relative overflow-hidden">
          <!-- marca d'água -->
          <img src="{{ url_for('static', filename='logo-biocamp.png') }}"
               style="position:absolute;top:50%;left:50%;width:60%;opacity:0.06;transform:translate(-50%,-50%);pointer-events:none;">
          <h2 class="text-center mb-4" style="color:#1a355e;">Login</h2>
          {% with messages = get_flashed_messages(category_filter=["danger"]) %}
            {% if messages %}
              <div class="alert alert-danger">{{ messages[0] }}</div>
            {% endif %}
          {% endwith %}
          <form method="POST">
            <div class="mb-3">
              <label for="email" class="form-label">E-mail</label>
              <input type="email" class="form-control" id="email" name="email" required>
            </div>
            <div class="mb-3">
              <label for="senha" class="form-label">Senha</label>
              <input type="password" class="form-control" id="senha" name="senha" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Entrar</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
