<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Admin – Produtos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-4">
    <h2 class="mb-3">Gerenciar Produtos</h2>
    {% with messages = get_flashed_messages(category_filter=["success"]) %}
      {% if messages %}
      <div class="alert alert-success">{{ messages[0] }}</div>
      {% endif %}
    {% endwith %}
    <form method="POST" class="row g-3 mb-4">
      <div class="col-md-6">
        <input type="text" name="nome" class="form-control" placeholder="Nome do produto" required>
      </div>
      <div class="col-md-3">
        <input type="number" name="minimo" class="form-control" placeholder="Estoque mínimo" required>
      </div>
      <div class="col-md-3">
        <button type="submit" class="btn btn-primary w-100">Criar Produto</button>
      </div>
    </form>
    <table class="table table-striped">
      <thead><tr><th>Nome</th><th>Saldo</th><th>Mínimo</th></tr></thead>
      <tbody>
        {% for p in produtos %}
        <tr>
          <td>{{ p.nome }}</td>
          <td>{{ p.saldo }}</td>
          <td>{{ p.minimo }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
    <a href="{{ url_for('estoque') }}" class="btn btn-link">Voltar</a>
  </div>
</body>
</html>
