<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Estoque – Biocamp</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="{{ url_for('static', filename='favicon.png') }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand" href="{{ url_for('estoque') }}">Estoque Biocamp</a>
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="{{ url_for('movimentacao') }}">Movimentar</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('historico') }}">Histórico</a></li>
        {% if usuario.tipo == 'admin' %}
        <li class="nav-item"><a class="nav-link" href="{{ url_for('admin_produtos') }}">Produtos</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('admin_usuarios') }}">Usuários</a></li>
        {% endif %}
        <li class="nav-item"><a class="nav-link text-danger" href="{{ url_for('auth.logout') }}">Sair</a></li>
      </ul>
    </div>
  </nav>
  <div class="container py-4">
    <h2 class="mb-3">Lista de Produtos</h2>
    <table class="table table-striped table-hover">
      <thead class="table-light">
        <tr>
          <th>Nome</th>
          <th>Saldo</th>
          <th>Mínimo</th>
        </tr>
      </thead>
      <tbody>
        {% for p in produtos %}
        <tr>
          <td>{{ p.nome }}</td>
          <td>{{ p.saldo }}</td>
          <td>{{ p.minimo }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</body>
</html>
