<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Movimentação – Estoque Biocamp</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="{{ url_for('static', filename='favicon.png') }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-4">
    <h2 class="mb-4">Registrar Movimentação</h2>
    {% with messages = get_flashed_messages(category_filter=["warning","success"]) %}
      {% for msg in messages %}
      <div class="alert alert-{{ "warning" if "insuficiente" in msg else "success" }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    <form method="POST">
      <div class="mb-3">
        <label for="produto_id" class="form-label">Produto</label>
        <select id="produto_id" name="produto_id" class="form-select" required>
          <option value="" disabled selected>Selecione…</option>
          {% for p in produtos %}
          <option value="{{ p.id }}">{{ p.nome }} ({{ p.saldo }})</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label for="quantidade" class="form-label">Quantidade</label>
        <input type="number" id="quantidade" name="quantidade" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Tipo</label>
        <div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="tipo" id="entrada" value="entrada" checked>
            <label class="form-check-label" for="entrada">Entrada</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="tipo" id="saida" value="saida">
            <label class="form-check-label" for="saida">Saída</label>
          </div>
        </div>
      </div>
      <button type="submit" class="btn btn-primary">Registrar</button>
      <a href="{{ url_for('estoque') }}" class="btn btn-link">Voltar</a>
    </form>
  </div>
</body>
</html>
